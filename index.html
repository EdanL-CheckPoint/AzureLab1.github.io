<!DOCTYPE html>
<html>
<head>
  <title>Check Point Azure Lab 1</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background-color: #db7093;
    }

    header {
      background-color: #333;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav {
      background-color: #555;
      padding: 10px;
      text-align: center;
    }

    nav a {
      color: white;
      margin: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    section {
      padding: 40px;
      margin: 20px;
      background: white;
      border-radius: 10px;
    }

    img {
      max-width: 300px;
      display: block;
      margin: 20px auto;
      border-radius: 10px;
    }
  </style>

</head>

<body>

  <header>
    <h1>My Website</h1>
    <p>Welcome to my GitHub hosted page</p>
  </header>

  <nav>
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
  </nav>

  <!-- Image Section -->
  <section>
    <h2>My Image</h2>
    <!-- IMPORTANT: replace filename with your image name -->
    <img src="test.jpg" alt="My Image">
  </section>

  <section id="about">
    <h2>About Me</h2>
    <p>This is a section where you describe yourself.</p>
  </section>

  <section id="projects">
    <h2>Projects</h2>
    <p>List your projects here.</p>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <p>Email: example@email.com</p>
  </section>

</body>
</html>
